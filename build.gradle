plugins {
    id("java")
}

group = "org.example"
version = "1.0-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('updateDaemonJvm') {
    languageVersion = JavaLanguageVersion.of(21)
    // Use an installed JDK; do not generate platform-specific download URLs.
    toolchainPlatforms = []
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
// https://mvnrepository.com/artifact/org.testng/testng
    testImplementation 'org.testng:testng:7.10.1'
//Http client library
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
//Jackson utility library to parse POJO to JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'
//Selenium Framework Library
    implementation 'org.seleniumhq.selenium:selenium-java:4.52.0'
//Library for random string generation in TestEventDataInitializer.java
    implementation 'org.apache.commons:commons-lang3:3.0'
// Testing frameworks and libraries
    implementation 'org.assertj:assertj-core:3.23.1'
    testImplementation 'org.assertj:assertj-core:3.23.1'
// Cucumber
    testImplementation(platform("io.cucumber:cucumber-bom:7.18.0"))
    testImplementation("io.cucumber:cucumber-java")
    testImplementation("io.cucumber:cucumber-junit-platform-engine")
    testImplementation("org.junit.platform:junit-platform-suite")
// Logging libraries
    testImplementation 'org.codehaus.janino:janino:3.1.9'
    implementation 'org.codehaus.janino:janino:3.1.9'
    testImplementation 'ch.qos.logback:logback-classic:1.4.5'
    implementation 'ch.qos.logback:logback-classic:1.4.5'
    testImplementation 'ch.qos.logback:logback-core:1.4.5'
    implementation 'ch.qos.logback:logback-core:1.4.5'
// General purpose libraries
    implementation 'io.vavr:vavr:1.0.0-alpha-4'
//CSV files handler
    implementation 'com.opencsv:opencsv:5.7.1'
// https://mvnrepository.com/artifact/io.qameta.allure/allure-junit5
    testImplementation 'io.qameta.allure:allure-junit5:2.23.0'
//RestAssured libs
// https://mvnrepository.com/artifact/org.hamcrest/hamcrest
    testImplementation 'org.hamcrest:hamcrest:2.2'
// https://mvnrepository.com/artifact/io.rest-assured/rest-assured
    testImplementation 'io.rest-assured:rest-assured:5.3.1'
}

tasks.test {
    useJUnitPlatform()
    systemProperty 'cucumber.execution.dry-run',
            providers.gradleProperty('cucumberDryRun').getOrElse('false')
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
